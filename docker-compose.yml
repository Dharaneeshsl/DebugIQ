version: "3.9"

services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    depends_on:
      - rabbitmq
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/

  worker:
    build: ./backend
    depends_on:
      - rabbitmq
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
    command: ["python", "worker.py"]
  
  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
