name: Backend CI

on:
  push:
    paths:
      - "backend/**"
      - "frontend/**"
      - "scripts/**"
      - "PRODUCTION.md"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "backend/**"
      - "frontend/**"
      - "scripts/**"
      - "PRODUCTION.md"
      - ".github/workflows/backend-ci.yml"

jobs:
  backend:
    runs-on: windows-latest
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements-release.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements-release.txt

      - name: Import check
        run: |
          python -m py_compile backend/main.py backend/parser.py backend/preprocessor.py backend/categorizer.py backend/deduplicator.py backend/clusterer.py backend/scorer.py backend/mongo_store.py backend/auth_utils.py backend/services/pipeline.py backend/worker.py backend/ml/explainability.py

      - name: Tests
        run: |
          python -m pytest -q backend/tests
        env:
          DEBUGIQ_EMBEDDINGS_BACKEND: tfidf

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build and audit the shipped dashboard
        working-directory: frontend
        run: |
          npm ci --no-audit
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm audit --omit=dev
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm run build

      - name: Verify extracted release and database recovery
        run: |
          $archive = pwsh -NoProfile -File scripts/package_release.ps1
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python scripts/verify_release.py $archive
