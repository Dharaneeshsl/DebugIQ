name: Backend CI

on:
  push:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

jobs:
  backend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Import check
        run: |
          python -m py_compile backend/main.py backend/parser.py backend/preprocessor.py backend/categorizer.py backend/deduplicator.py backend/clusterer.py backend/scorer.py backend/mongo_store.py backend/auth_utils.py backend/services/pipeline.py backend/worker.py backend/ml/explainability.py

      - name: Tests
        run: |
          pytest -q backend/tests
